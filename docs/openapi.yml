openapi: 3.0.3
info:
  title: Sellora API
  version: 1.0.0
  description: |2

    ## Sellora Backend API

    Multi-tenant SaaS backend for the Sellora platform.

    ### Authentication
    All dashboard endpoints require a Bearer JWT token:
    ```
    Authorization: Bearer <access_token>
    ```

    Obtain a token by completing the Google OAuth flow:
    1. Navigate to `GET /api/v1/auth/google/?next=web` in a browser
    2. Complete Google sign-in
    3. Collect `access` and `refresh` tokens from the redirect URL

    ### Multi-tenancy
    All business-scoped endpoints follow the pattern:
    ```
    /api/v1/businesses/{business_id}/<resource>/
    ```

    ### Public Storefront API
    Routes under `/api/v1/store/{slug}/` require no authentication.
    Only published storefronts (`is_published=true`) are accessible.

    ### Currency
    All monetary amounts are in **KES (Kenyan Shillings)**.
paths:
  /api/v1/auth/google/:
    get:
      operationId: auth_google_retrieve
      description: Redirects the browser to Google's sign-in page. Open in a browser
        — not callable from Postman directly.
      summary: Initiate Google OAuth
      parameters:
      - in: query
        name: next
        schema:
          type: string
        description: '''web'' or ''app'''
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/google/callback/:
    get:
      operationId: auth_google_callback_retrieve
      description: Google OAuth callback — called automatically by Google.
      summary: Google OAuth callback (reference only)
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/me/:
