      description: |-
        POST /api/v1/businesses/{business_id}/storefront/publish/
        POST /api/v1/businesses/{business_id}/storefront/unpublish/
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/businesses/{business_id}/storefront/unpublish/:
    post:
      operationId: businesses_storefront_unpublish_create
      description: |-
        POST /api/v1/businesses/{business_id}/storefront/publish/
        POST /api/v1/businesses/{business_id}/storefront/unpublish/
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/businesses/by-slug/{slug}/:
    get:
      operationId: businesses_by_slug_retrieve
      description: |-
        GET /api/v1/businesses/by-slug/{slug}/

        Resolves a business slug to its full profile.
        Used by the frontend to initialise the storefront context.
        No authentication required — public endpoint.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/plans/:
    get:
      operationId: plans_retrieve
      description: |-
        GET /api/v1/plans/

        Returns all pricing plans. Public — used by the marketing/landing page
        and the Settings → Billing tab.
        No authentication required.
      tags:
      - plans
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/:
    get:
      operationId: store_retrieve
      description: |-
        GET /api/v1/store/{slug}/

        Returns the full business profile for the storefront home page.
        Includes theme, hero, contact, social links, storefront settings.
        Does NOT include costPrice or any private fields.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/categories/:
    get:
      operationId: store_categories_retrieve
      description: |-
        GET /api/v1/store/{slug}/categories/

        Returns active categories for storefront filtering.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/messages/:
    post:
      operationId: store_messages_create
      description: |-
        POST /api/v1/store/{slug}/messages/

        Submit a contact form message from the storefront.
        No authentication required.

        On success:
          - CustomerMessage created with status=unread
          - Email notification dispatched to business owner (if enabled)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/orders/:
    post:
      operationId: store_orders_create
      description: |-
        POST /api/v1/store/{slug}/orders/

        Place an order from the storefront checkout page.
        No authentication required.

        Request body matches OrderCreateSerializer — same as dashboard,
        but channel defaults to 'online' and is not changeable from
        the storefront (frontend always sends online orders).

        On success:
          - Order created with status=new
          - Stock decremented
          - Customer auto-created/upserted by phone
          - New order email notification dispatched (if enabled)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/products/:
    get:
      operationId: store_products_retrieve
      description: |-
        GET /api/v1/store/{slug}/products/

        Returns active + available products for the storefront shop page.
        costPrice is NEVER included (ProductPublicSerializer).

        Query params:
            category_id  — filter by category UUID
            search       — partial name match
            sort         — featured | newest | price-asc | price-desc | best-selling
            page, page_size
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/store/{slug}/products/{product_slug}/:
    get:
      operationId: store_products_retrieve_2
      description: |-
        GET /api/v1/store/{slug}/products/{product_slug}/

        Returns a single product by its slug.
        Used by the storefront product detail page.
      parameters:
      - in: path
        name: product_slug
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - store
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/upload/image/:
    post:
      operationId: upload_image_create
      description: |-
        POST /api/v1/upload/image/

        Upload a single image file.
        Returns the public URL of the uploaded image.

        Used by:
          - Business logo upload (onboarding + settings)
          - Product images
          - Storefront hero image

        Request: multipart/form-data
          file — the image file (required)
          folder — optional subfolder hint (e.g. 'products', 'logos', 'hero')
                    stored under media/{folder}/{uuid}.{ext}

        Response:
          { "success": true, "data": { "url": "http://..." } }

        Storage:
          Development: local media/ directory (served by Django in DEBUG mode)
          Production:  S3 via django-storages (when USE_S3=True in settings)
      tags:
      - upload
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Business:
      type: object
      description: |-
        Full business representation returned by GET endpoints.

        Nested JSON fields are returned as structured objects, not raw dicts,
        so the frontend gets predictable shapes.

        Read-only — never used for input validation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          format: uuid
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: URL-safe identifier used in storefront URLs e.g. /store/maison-aura/
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        motto:
          type: string
          readOnly: true
        logo:
          type: string
          format: uri
          readOnly: true
        favicon:
          type: string
          format: uri
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          readOnly: true
        theme:
          readOnly: true
        contact:
          readOnly: true
        social_links:
          readOnly: true
        hero:
          readOnly: true
        about_text:
          type: string
          readOnly: true
        total_products:
          type: integer
          readOnly: true
        total_orders:
          type: integer
          readOnly: true
        total_customers:
          type: integer
          readOnly: true
        total_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_storefront_published:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - about_text
      - category
      - contact
      - created_at
      - description
      - favicon
      - hero
      - id
      - is_storefront_published
      - logo
      - motto
      - name
      - owner_email
      - owner_id
      - owner_name
      - plan
      - slug
      - social_links
      - status
      - theme
      - total_customers
      - total_orders
      - total_products
      - total_revenue
      - updated_at
    BusinessCreateRequest:
      type: object
      description: |-
        Validates the 4-step onboarding payload.

        The frontend sends one combined POST with all steps merged:
            Step 1 — name, category, description, motto
            Step 2 — logo (URL from upload endpoint), contact info
            Step 3 — theme customisation
            Step 4 — hero content
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        category:
          $ref: '#/components/schemas/CategoryEnum'
        description:
          type: string
          maxLength: 1000
        motto:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
        contact:
          $ref: '#/components/schemas/ContactRequest'
        theme:
          $ref: '#/components/schemas/ThemeRequest'
        hero:
          $ref: '#/components/schemas/HeroRequest'
        about_text:
          type: string
      required:
      - category
      - name
    CategoryEnum:
      enum:
      - cosmetics
      - perfumes
      - fashion
      - accessories
      - beauty
      - gifts
      - electronics
      - food
      - other
      type: string
      description: |-
        * `cosmetics` - Cosmetics
        * `perfumes` - Perfumes
        * `fashion` - Fashion
        * `accessories` - Accessories
        * `beauty` - Beauty
        * `gifts` - Gifts
        * `electronics` - Electronics
        * `food` - Food & Beverages
        * `other` - Other
    ContactRequest:
      type: object
      properties:
        phone:
          type: string
          maxLength: 30
        whatsapp:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        openingHours:
          type: string
          maxLength: 255
    HeroRequest:
      type: object
      properties:
        heading:
          type: string
          maxLength: 255
        subheading:
          type: string
          maxLength: 500
        ctaText:
          type: string
          maxLength: 100
        ctaSecondaryText:
          type: string
          maxLength: 100
        imageUrl:
          type: string
          format: uri
    PlanEnum:
      enum:
      - starter
      - business
      - growth
      type: string
      description: |-
        * `starter` - Starter
        * `business` - Business
        * `growth` - Growth
    StatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    ThemeRequest:
      type: object
      properties:
        primaryColor:
          type: string
          minLength: 1
          maxLength: 7
        primaryHover:
          type: string
          minLength: 1
          maxLength: 7
        accentColor:
          type: string
          minLength: 1
          maxLength: 7
        backgroundColor:
          type: string
          minLength: 1
          maxLength: 7
        textColor:
          type: string
          minLength: 1
          maxLength: 7
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: |-
        Read-only representation of a user.

        Used by:
          - GET /api/v1/auth/me/  → returns the current user's profile
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar
      - created_at
      - email
      - id
      - is_staff
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Authentication — Google OAuth 2.0 + JWT
- name: businesses
  description: Business management — CRUD, settings, storefront config
- name: products
  description: Product catalogue — CRUD, availability, stock
- name: categories
  description: Product categories
- name: inventory
  description: Stock management and adjustment audit log
- name: orders
  description: Order processing — state machine, timeline
- name: customers
  description: Customer records — auto-created from orders
- name: finances
  description: Expenses and P&L financial summary
- name: analytics
  description: Business analytics — KPIs, time-series, rankings
- name: messages
  description: Customer inquiries from the storefront contact form
- name: storefront
  description: Public storefront API — no auth required
- name: uploads
  description: File upload — images for products, logos, hero
- name: plans
  description: Pricing plans — public
- name: billing
  description: Subscription management — upgrade, cancel
